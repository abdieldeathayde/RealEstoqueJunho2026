<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Estoque</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/theme.css">
    <!-- em Spring Boot arquivos static NÃO usam ../ -->
    <link rel="stylesheet" href="../static/cadastro.css">
</head>

<body class="auth-page">

<div class="auth-card">
    <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
    <h2>Criar conta</h2>
    <p class="auth-subtitle">Cadastre-se para acessar o sistema</p>

    <form id="cadastroForm">

        <label for="username">Usuário</label>
        <input
                type="text"
                id="username"
                placeholder="Digite seu usuário"
                required
        />

        <label for="password">Senha</label>
        <input
                type="password"
                id="password"
                placeholder="Digite sua senha"
                required
        />

        <label for="role">Perfil</label>
        <select id="role">
            <option value="USER">Usuário</option>
            <option value="ADMIN">Administrador</option>
        </select>

        <button type="submit">Cadastrar</button>

        <p id="mensagem"></p>
    </form>

    <div class="auth-footer">
        Já possui uma conta? <a href="login.html">Fazer login</a>
    </div>
</div>

<!-- faltava fechar aspas -->
<script src="../static/cadastro.js"></script>

</body>
</html>
